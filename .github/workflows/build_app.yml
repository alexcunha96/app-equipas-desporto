name: Criar Versao Web para iPhone

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Obter dependências
        run: flutter pub get
        
      - name: Criar Versão Web
        run: flutter build web --release
        
      - name: Guardar Ficheiro para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-web-iphone
          path: build/web/
